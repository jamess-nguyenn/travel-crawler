services:
  golang:
    build:
      context: .
      dockerfile: docker/golang/Dockerfile
      target: dev
    container_name: golang
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "8000:8000"
      - "2345:2345"
    depends_on:
      - mysql
      - redis
      - kafka
    command: ["tail", "-f", "/dev/null"]

  accommodation-worker:
    build:
      context: .
      dockerfile: docker/golang/Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mysql:
    image: mysql:9.7.4
    container_name: mysql
    restart: unless-stopped
    env_file:
      - docker/mysql/.env
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "0.0.0.0", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8.6.8
    container_name: redis
    restart: unless-stopped
    env_file:
      - docker/redis/.env
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    command:
      - sh
      - -c
      - |
        printf 'user default off\nuser %s on >%s ~* &* +@all\nappendonly yes\n' \
          "$$REDIS_USERNAME" "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli --user "$$REDIS_USERNAME" --pass "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redisinsight:
    image: redis/redisinsight:3.8.0
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    restart: unless-stopped
    env_file:
      - docker/kafka/.env
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafkaui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafkaui
    restart: unless-stopped
    env_file:
      - docker/kafkaui/.env
    ports:
      - "8080:8080"
    depends_on:
      - kafka

volumes:
  go-mod-cache:
  mysql-data:
  redis-data:
  redisinsight-data:
  kafka-data: